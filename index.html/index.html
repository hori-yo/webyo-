<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ</title>
<meta HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F6F8;
    --card: #FFFFFF;
    --ink: #16232B;
    --ink-soft: #48606B;
    --line: #C7D9E0;
    --accent: #1F8FB3;
    --accent-deep: #135C78;
    --accent-soft: #DCF0F5;
    --gold: #4FD1E0;
    --radius: 4px;
    --shadow: 0 24px 60px -32px rgba(19,92,120,0.35);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 15% -10%, #E9F3F6 0%, transparent 60%),
      var(--bg);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:64px 20px;
  }

  .wrap{
    width:100%;
    max-width:640px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .eyebrow .bar{
    width:28px;
    height:2px;
    background:var(--gold);
  }
  .eyebrow span{
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--ink-soft);
    font-weight:500;
  }

  h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 4vw, 36px);
    line-height:1.4;
    margin:0 0 10px;
    color:var(--accent-deep);
    letter-spacing:0.02em;
  }

  .lede{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.9;
    margin:0 0 40px;
    max-width:52ch;
  }

  form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:44px 40px 40px;
    position:relative;
    overflow:hidden;
  }

  form::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:100%;
    height:3px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--gold) 100%);
  }

  /* ---- section headers ---- */
  .section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 22px;
  }
  .section-title:not(:first-child){
    margin-top:8px;
  }
  .section-title .num{
    width:22px; height:22px;
    border-radius:50%;
    background:var(--accent-deep);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .section-title h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15.5px;
    font-weight:700;
    color:var(--accent-deep);
    margin:0;
    letter-spacing:0.02em;
  }

  .field{
    margin-bottom:26px;
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }

  label{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:14px;
    font-weight:700;
    color:var(--accent-deep);
    margin-bottom:9px;
    letter-spacing:0.02em;
  }

  label.optional::after{
    content:"任意";
    font-size:11px;
    font-weight:700;
    color:var(--accent-deep);
    background:var(--accent-soft);
    border:1px solid #B9DCE6;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:0.05em;
  }

  label.required::after{
    content:"必須";
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--accent-deep);
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:0.05em;
  }

  input[type="text"],
  input[type="date"],
  select,
  textarea{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:#FFFFFF;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }

  textarea{
    resize:vertical;
    min-height:88px;
    line-height:1.7;
  }

  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2348606B' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
    cursor:pointer;
  }

  input::placeholder,
  textarea::placeholder{
    color:#7E939C;
  }

  input[type="text"]:hover,
  input[type="date"]:hover,
  select:hover,
  textarea:hover{
    border-color:#A9C6D1;
  }

  input[type="text"]:focus,
  input[type="date"]:focus,
  select:focus,
  textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 4px var(--accent-soft);
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:36px 0 30px;
  }

  button[type="submit"]{
    width:100%;
    background:var(--accent-deep);
    color:#F2F6F8;
    border:none;
    border-radius:var(--radius);
    padding:15px 20px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.08em;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
    margin-top:6px;
  }

  button[type="submit"]:hover{
    background:var(--accent);
  }

  button[type="submit"]:active{
    transform:translateY(1px);
  }

  .privacy-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:16px;
    line-height:1.7;
  }

  .field-note{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:-16px;
    margin-bottom:24px;
  }

  .check-list{
    border:1.5px solid var(--accent);
    border-radius:var(--radius);
    overflow:hidden;
    background:#FCFDFE;
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    transition:background .12s ease, color .12s ease;
  }
  .check-row:last-child{ border-bottom:none; }
  .check-row:hover{ background:var(--accent-soft); }
  .check-row:has(input:checked){
    background:var(--accent-soft);
    color:var(--accent-deep);
    font-weight:700;
  }
  .check-row input[type="checkbox"]{
    width:19px; height:19px;
    accent-color:var(--accent-deep);
    cursor:pointer;
    flex-shrink:0;
  }

  @media (max-width:560px){
    body{ padding:32px 12px; }
    .wrap{ max-width:100%; }
    form{ padding:28px 18px 26px; }
    .field-row{ grid-template-columns:1fr; gap:0; }
    .lede{ font-size:13.5px; margin-bottom:28px; }
    .section-title h2{ font-size:14.5px; }
    .check-row{ padding:15px 16px; }
    button[type="submit"]{ padding:16px 20px; font-size:15.5px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

        <input id="00N_BIRTHDATE" name="00N_BIRTHDATE" type="date">

    <hr class="divider">
